apiVersion: apps/v1
kind: Deployment
metadata:
  name: devmind-orchestrator
  namespace: devmind
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devmind-orchestrator
  template:
    metadata:
      labels:
        app: devmind-orchestrator
    spec:
      containers:
        - name: devmind-orchestrator
          image: __REGISTRY__/devmind-orchestrator:test
          imagePullPolicy: Always
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: __OTEL_ENDPOINT__
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: devmind-orchestrator
  namespace: devmind
spec:
  type: LoadBalancer
  selector:
    app: devmind-orchestrator
  ports:
    - port: 8002
      targetPort: 8002
